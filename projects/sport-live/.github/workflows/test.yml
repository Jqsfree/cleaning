name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install duckdb pandas pytest

      - name: Run tests
        working-directory: .
        run: python -m pytest tests/test_scoring.py tests/test_qc.py -v
