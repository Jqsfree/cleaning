# Blacklist — exo 渔业牧业（非渔牧主题闸门）
# v0.1.0: 共享硬噪声（非真人/MV/新闻/儿歌）
# v0.2.0: 加 mukbang_recipe（round1 样本 4F 0T 0U）
# v0.3.0: keep 文本审计扩规则 — 共享非农串台 + 渔牧 certain-noise
# v0.4.0: srs_v03_c90 人标 F（T43/F227）挖 certain-noise；金标 T_hurt=0
# v0.5.0: v1.1 验收 F（休闲渔具/fillet/综艺）certain-noise；双金标 T_hurt=0

[meta]
version = "0.5.0"
category = "exo_livestock"
basis = "v0.4 + v11_accept_c90 F certain-noise; T_hurt=0 on v0.1∪v1.1; 2026-09-16"

# ── 烹饪 / 吃播 ──
[[pass2]]
category = "mukbang_recipe"
pattern = "(?i)(\\bmukbang\\b|how\\s*to\\s*cook|\\brecipe\\b|#cooking\\b)"

[[pass2]]
category = "catch_and_cook"
pattern = "(?i)(catch\\s*(and|&)\\s*cook|catching\\s+.{0,40}cook(?:ing)?|cooking\\s+for\\s+(puppies|dogs?|lu)|go\\s+to\\s+market\\s+sell.{0,40}cook)"

[[pass2]]
category = "street_food"
pattern = "(?i)\\bstreet\\s+food\\b"

[[pass2]]
category = "dessert_recipes"
pattern = "(?i)(dessert\\s+recipes?|\\bso\\s+yummy\\b)"

[[pass2]]
