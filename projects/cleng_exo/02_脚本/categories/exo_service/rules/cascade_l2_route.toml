# L2 — 商业服务品类路由（二元：像 / 不像）
# 不再按 hair/beauty/food… 分行业；命中 → commercial_service_candidates
# 口径：店内/柜台/后厨等商业服务劳动场景文本信号（允许误报，不判合格）

[meta]
version = "2.0.0"
category = "exo_service"
layer = "l2_category_route"
basis = "2026-09-15 rebuild: category not industry"

primary_order = ["commercial_service"]

[[route]]
industry = "commercial_service"
pattern = "(?i)理发|美发|剪发|洗剪吹|烫发|染发|发型师|造型师|barber|barbershop|haircut|hairstyl|hair\\s*salon|美甲|纹绣|嫁接睫毛|美容护理|美容院|manicure|pedicure|nail\\s*(tech|salon)|facial|spa\\s*treatment|后厨|传菜|吧台|咖啡师|服务员|厨师长|餐饮服务|\\bbarista\\b|\\bwaiter\\b|\\bwaitress\\b|back\\s*of\\s*house|\\bchef\\b|restaurant\\s*kitchen|收银|理货|超市收银|便利店店员|\\bcashier\\b|checkout\\s*counter|保洁|家政清洁|客房服务|酒店前台|housekeep|\\bjanitor\\b|front\\s*desk|汽修|钣金|喷漆|洗车|维修|修理|\\bplumber\\b|\\belectrician\\b|auto\\s*repair|car\\s*wash|body\\s*shop|宠物美容|pet\\s*groom|\\bgrooming\\b|商业服务|门店服务|给顾客"
