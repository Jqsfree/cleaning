# L4 理发专用缩略图 VLM（不全量）
# human261 校准：v1 精确率 91.5% 召回 55%；v2 放宽教程/ASMR 封面判 T
# 推荐与 L3 q3 并用：q3>=0.004 OR VLM=T → pass 90% 召回 71%

[meta]
category = "exo_service"
category_label = "exo理发店内实操"
version = "1.1.0"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否像「理发/美发店内，发型师正在给顾客做剪发、染发、烫发、吹风或修面」。只输出 T 或 F。

输出 T 当封面**已经能看到服务劳动**：
- 发型师的手+剪刀/染刷/吹风机等，正在处理**另一位真人**的头发或头部
- 顾客背对/侧对镜头、只露后脑/侧脸也算 T（不必看到两张脸）
- 哪怕标题像教程/ASMR/step-by-step，只要封面是店内给真人顾客操作 → T
- 老式 barber 修面、洗头、按摩若明显在店内给顾客做 → T

下列一律 F（封面上看不到上述服务，或根本不是店内实操）：
- 非真人：卡通/Anime/AI 脸/游戏/手绘海报
- 自己给自己剪、对镜自拍剪发、纯口播对镜头无操作
- 只有产品瓶/广告海报/文字大字，看不到给人做头发
- 植发手术对比图、诊所 graft/FUE 宣传、毛囊特写
- 户外/路边/农村风景/公益剪发排队远景，不像店内工位
- 纯跟练扎发步骤图、发簪 DIY 海报，看不到发型师给顾客剪染
- 假人头/mannequin **单独**特写且看不到给真人顾客服务

拿不准：真人、像店内、像在做头发 → T。不要因为标题含 tutorial 就 F。

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "店内给顾客剪染造型"
fail_label = "教程广告口播植发户外或非真人"
