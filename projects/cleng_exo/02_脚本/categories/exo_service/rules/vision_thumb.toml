# Vision QC — exo 视角 · 商业服务（美容/餐饮/护理等店内实操）
# 入口: 02_脚本/qc/vision_thumb.py input.csv -c exo_service -t 12
# 级联：文本 keep_for_visual → 本缩略图（抽样）→ 双过再人工；够量后用图像分类替代 VL
# 策略：只 F「确定噪声 / 非真人」；像店内服务实操或看不清 → T（少误杀）

[meta]
category = "exo_service"
category_label = "exo商业服务"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否允许进入「商业服务」候选。只输出 T 或 F。

PDF 目标参照（仅作否决边界，封面验不了机位细节）：
第三人称、真人在商业/生活服务场景中执行服务劳动（理发上色、美甲、按摩护理、收银理货、后厨传菜、咖啡制作等店内实操）。

**非真人一律 F**（命中任一即 F）：
游戏/Gameplay、动画/卡通/Anime、AI 生成脸或场景、CGI/3D、VTuber、纯绘面。看不清是不是真人实拍时，为防非真人进入，输出 F。

确定噪声也 F（封面已能看清）：
- 对镜头口播/访谈/新闻主播/播客分屏/坐着讲课 PPT
- 纯商品静物广告、产品棚拍无人服务、品牌 Lookbook 无人上岗
- 植发前后对比海报、医疗手术特写当广告（无店内服务劳动）
- 纯风景旅游、影视预告/短剧、音乐 MV、儿童卡通娱乐
- 纯餐桌试吃/吃播、无人后厨的成品摆盘秀
- 健身房自拍口播、无关娱乐 vlog 封面（看不出服务劳动）
- 假横屏（竖屏两侧模糊条）

输出 T（其余都过，包括拿不准）：
- 真人在理发店/美容院/按摩店/餐厅后厨或柜台旁做事
- 能看到人或手在做服务相关操作；不要只因「可能是 POV / 略糊 / 半身」就 F
- 主题像店内服务实操即可，不必在封面确认第三人称全身

不要用「不够中近景 / 不像第三人称」打 F。只对非真人和上面那些确定噪声打 F。

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "商业服务实操候选"
fail_label = "非真人或确定噪声封面"
