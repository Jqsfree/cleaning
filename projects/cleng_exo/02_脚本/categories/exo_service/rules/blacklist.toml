# Blacklist — exo 商业服务/餐饮（certain-noise only）
# PDF 五.exo 服务业不收：对话访谈、教学培训、美妆护理讲解、商业演讲、音乐教学、
# 冲突对抗、运动竞技、远景转播、成片剪辑
# 只丢标题/频道上可确定的噪声；U/中间带勿进 pass2

[meta]
version = "0.6.0"
category = "exo_service"
basis = "PDF exo service + text QC F rounds 0814; v0.5 add 减肥/瘦身/减脂 (10F/0TU cumulative, not salon 护肤)"

