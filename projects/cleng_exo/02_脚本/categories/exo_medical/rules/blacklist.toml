pattern = "(?i)(\\babc\\s*news\\b|\\bbbc\\s*news\\b|\\bctv\\s*news\\b|\\bndtv\\b|eyewitness\\s*news|breaking\\s*news|news\\s*conference|\\bsky\\s*news\\b|meidastouch)"

[[pass2]]
