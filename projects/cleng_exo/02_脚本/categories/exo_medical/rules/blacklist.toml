# Blacklist — exo 医疗实验（非医疗实验主题闸门 / certain-noise）
# 口径：只丢与「实验室实操/实验演示」无关的确定串台；
#       细菌培养/切片染色/ELISA 等实操不进黑名单；禁止裸词 lab/experiment/tutorial/lecture。
# v0.4.0: PDF + R2人工F + text QC 270（旧机采）
# v0.5.0: 医疗实验_merged_0920 主题审计 — 频道闸 + 政治/影视/考证MCQ/养生/修车等增量

[meta]
version = "0.5.0"
category = "exo_medical"
basis = "医疗实验_merged_0920 topic audit; keep=lab experiment hands-on; no gold yet"

# ── 高密度纯串台频道（本池观测；channel 列 exact）──
[[channel_pass2]]
category = "politics_news_ch"
pattern = "(?i)^(MeidasTouch|Sky News|Globy News|KCRA 3)$"

[[channel_pass2]]
category = "talk_show_podcast_ch"
pattern = "(?i)^(Armchair Expert with Dax Shepard|Jimmy Kimmel Live|Andrew Huberman|TEDx Talks|Public Health On Call|Big Think|The Ramsey Show Highlights)$"

[[channel_pass2]]
category = "movie_music_ch"
pattern = "(?i)^(Cinema Epoch|MedicineBank Records|sonicstate)$"

[[channel_pass2]]
category = "exam_career_ch"
pattern = "(?i)^(Unacademy Live - NEET PG|Last Minute Lecture|Med School Survival Guide|Mehlmanmedical|Medicosis Perfectionalis)$"

[[channel_pass2]]
category = "wellness_finance_game_ch"
pattern = "(?i)^(Dr\\. Eric Berg DC|Caleb Hammer|jacksepticeye)$"

[[channel_pass2]]
category = "offtopic_hobby_ch"
pattern = "(?i)^(Trash Bin Cleaners Direct Owner Dan Swede|Fran Blanche|telugu car review)$"

# ── 游戏 / 动画 / 非真人 ──
[[pass2]]
