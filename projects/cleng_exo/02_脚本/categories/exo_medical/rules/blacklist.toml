pattern = "(?i)(\\bgameplay\\b|lets?\\s*play|\\bminecraft\\b|\\bfortnite\\b|\\broblox\\b|\\bgta\\s*[45v]\\b|cities\\s*skylines|game\\s*grumps|\\banime\\b|\\bcartoon\\b|3d\\s*animation|cgi\\b|hyper\\s*light\\s*drifter|jacksepticeye)"

[[pass2]]
