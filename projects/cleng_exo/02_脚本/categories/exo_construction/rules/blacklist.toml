# v0.2.4: 金标改为四批累积合并（修复 v0.2.3 丢批次导致的规则回归）；旁证池随 run 参数化

[meta]
version = "0.2.4"
category = "exo_construction"
category_label = "建筑施工"
basis = "old T=90/F=177; jg T=125/F=141; jg2 T=101/F=119; c961 T=81/F=188"
notes = """
四层口径（keep = 频道闸通过，且不命中频道黑名单 / keyword 黑名单 / 标题硬噪声）：
  step0 规则过滤（频道闸）: 频道「施工标题命中率」>= 0.5 视为施工频道；
        命中率不足但本条标题自带施工词 → 放行。白名单 rules/channel_construction_allowlist.csv
  step1 频道黑名单: [[channel_pass2]]；合并金标纯 F 频道（n_t=0），清单 rules/channel_blacklist_pure_f.csv
  step2 keyword 黑名单: [[keyword_pass2]]；合并金标全 F 采样词（n_t=0 且 n_f>=2），硬闸整词丢弃
  step3 标题硬噪声: [[pass2]]；非施工确定噪声 + 「F 专属短语」

v0.2.4 修复（对齐审计）:
  ① 金标**累积合并四批**（labeled + 建工_6c91274f + 建工2_050a0200 + 建筑施工_c961381c，
     按 video_id 去重）；v0.2.3 只用了其中两批，导致 keyword/channel 清单缩水 + T 误杀。
  ② ML 旁证池改为上一轮最新打分（text_gov_v07，基于 run08_v023），基准留存率实测（不再硬编码）。

金标评估（脚本内断言）：四层叠加后**四批**金标 T_hurt = 0。
"""

