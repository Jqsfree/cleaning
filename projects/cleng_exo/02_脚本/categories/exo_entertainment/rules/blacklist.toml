# Blacklist — exo 娱乐表演（非真人现场/街头/才艺表演主题闸门）
# v0.1.0: 共享硬噪声 − 表演保留（演唱会/现场乐队/舞蹈排练不进）+ 本池串台
# v0.2.0: keep 摸底扩新闻台 / 动漫少儿卡通；窄博客 howto（勿裸词 blog/vlog）
# v0.3.0: text QC F 长尾 → 宁杀勿放（Topic 频道 / lyrics 轨 / full album / 时事·反应·教材等）
# v0.4.0: n1000 text QC → episode/remix/tutorial/reaction/news/film/workout 等（宁杀勿放）
# v0.5.0: n2000 text QC → comedy/series/gaming/reacts/trailer/sports 等（宁杀勿放）
# v0.6.0: n2000@v0.5 → how to / english / maths / church / football / learn 等（宁杀勿放）
# v0.7.0: n3000@v0.6 → vlog/story/disney/food/pets/business/bangla/mix 等（宁杀勿放）
# v0.8.0: n1000@v0.7 → MV/audio/challenge/toys/news/edu/reality/hobby 等（宁杀勿放）
# v0.9.0: 历史 LLM text QC 纯 F 频道 channel_pass2（F≥3 T=0，n=180）
# v1.0.0: v0.9 c90 人标（T114/F136，合格率45.6%）挖 F + 金标纯 F 频道；T_hurt=0
# 仍禁裸词：performance / dance / show / live / concert / cover / dj set / tips / commercial / tech / salon / conference / chill
# 口径：无人标时宁杀勿放；有金标后再按 T_hurt 回调

[meta]
version = "1.0.0"
category = "exo_entertainment"
basis = "v0.9 + human_v09_c90 gold mine; T_hurt=0; 2026-09-21"

# ── 游戏 / 模拟器 / 非真人 ──
