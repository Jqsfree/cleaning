# Blacklist — exo 烹饪教学（非餐饮/烹饪主题闸门）
# v0.1.0: 共享硬噪声 − 烹饪/吃播 DROP + 本池美妆/健身/短剧/游戏
# v0.1.1: 收窄误杀 — 去掉 full episode / travel vlog / podcast / minute crafts /
#         bare anime|cartoon / episode+serial；TEDx 勿匹配 Ted Reader
# v0.2.0: c90 人标（T37/F232）金标 t_hurt=0 增量 — 新闻/真人秀/财经考试/综艺串台等
# v0.3.0: v0.5 验收金标（T67/F204）t_hurt=0 — 美妆护发/健身减脂课/卡通/故事缝纫手工/挑战/评测幕后
# v0.4.0: 三批金标纯 F 频道黑名单 channel_pass2（n_t=0；见 channel_blacklist_pure_f.csv）
# v0.5.0: 五批金标纯 F 频道重刷（n_t=0 且 n_f≥2；含 v1.0/v1.2）
# v0.5.1: 扩展 n_f>n_t 混频道一并闸门
# v0.5.2: + LLM textQC n1000 纯F频道
# v0.5.3: + LLM textQC n500（新提示词）纯F频道
# v0.5.4: + LLM textQC n500b 纯F频道
# v0.5.4b: + LLM n500b 安全 title regex（样本 T_hurt=0）
# v0.5.5: + 人标 v1.6 c90 纯F频道（T_hurt=0）
# v0.5.6: + v1.6 非频道维 title regex（T_hurt=0）
# v0.5.7: + v1.6 纯F collect keyword 闸（见 keyword_blacklist_pure_f_v16.csv）
# 禁止裸词 how to / tutorial / vlog / 教程 / 裸 recipe / cooking show（误杀厨艺教学与金标 T）
# 禁止甜点/蛋糕整类（T 有 Peekaboo cake）；其余家常菜谱交 MiniLM / 频道闸

[meta]
version = "0.5.7"
category = "exo_cook"
basis = "channel_pass2 + gold v1.6 pure-F; 2026-09-20"

