# exo_agriculture 配方
# 机采：quality → sample → text_qc → rules（非农黑名单）→ MiniLM(τ) ；视觉暂不上
# 文本治理 v2：docs/exo_agriculture_text_governance_v2.md

[meta]
category = "exo_agriculture"
has_cleaner = true
deliver_format = "csv"
default_qc = "text"
needs_ge720 = false
layer1_stop = "rules"
notes = "黑名单=非农；MiniLM+τ=像T；τ越高越像T；视觉暂跳过"

[[flow.machine]]
id = "quality"
kind = "auto"

[[flow.machine]]
id = "stage0_tech_filter"
kind = "optional_auto"
depends = ["quality"]
hint = "技术深筛（分辨率≥1080p/假横屏/抖动/有效时长，逐条抓帧慢）：stage0_cleaning.py $SUBSET out.csv --id-col video_id --cookies-from-browser chrome；只对抽样/子集（万级以下），勿全量百万行"

[[flow.machine]]
id = "sample"
kind = "auto"
depends = ["quality"]

[[flow.machine]]
id = "text_qc"
kind = "optional_auto"
depends = ["sample"]
hint = "qc/text.py $SAMPLE --category exo_agriculture -w 20 -o $BATCH/03_qc/"

[[flow.machine]]
id = "rules"
kind = "external"
depends = ["text_qc"]
hint = "blacklist v0.6+ 只扩非农；农内噪声交 MiniLM；本阶段停在 rules + score_exo_agriculture_text"

[[flow.machine]]
id = "clean"
kind = "gated"
depends = ["rules"]
hint = "直接调 categories.exo_agriculture.cleaner；勿无 NOTES 就全量 clean"

[[flow.machine]]
id = "metadata_filter"
kind = "optional_auto"
depends = ["clean"]
hint = "Stage -1：apply_exo_agriculture_metadata_filter.py $KEEP -o $BATCH/06_tools/metadata_filter/ --threshold 0.3；产出 metadata_pass 再送 CLIP"

[[flow.machine]]
id = "clip_filter"
kind = "optional_auto"
depends = ["metadata_filter"]
hint = "metadata_pass 后：run_exo_agriculture_cascade_clip.py --skip-metadata-filter $BATCH/06_tools/metadata_filter/*_metadata_pass.csv -o $BATCH/06_tools/ --sample 0；只丢 clip_fail"

[[flow.machine]]
id = "thumb_qc"
kind = "optional_auto"
depends = ["clip_filter"]
hint = "qc/vision_thumb.py $BATCH/06_tools/*_clip_remain*.csv -c exo_agriculture -t 12 -o $BATCH/03_qc/thumb/"
