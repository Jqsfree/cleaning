# Blacklist — exo 农业种植采摘（非农主题闸门，text governance v2）
# v0.1–v0.5.3: 历史 certain-noise（含农内 howto/课程等）见 git
# v0.6.0: 收窄为「与农业无关」；农内噪声（howto/tips/课程/农机展播/堆肥教程等）交 MiniLM
#         依据 docs/exo_agriculture_text_governance_v2.md

[meta]
version = "0.6.0"
category = "exo_agriculture"
basis = "non-agri topic gate only; agri-internal F → MiniLM+τ; 2026-09-16"

# ── 烹饪 / 吃播（非田间农作）──
