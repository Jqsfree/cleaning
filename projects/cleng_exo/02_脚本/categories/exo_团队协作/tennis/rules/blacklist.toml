pattern = "(?i)^(Olympics|Olympic Games)$"

# ── 频道名含 olympic 一律拉黑（v1.0.1；覆盖 Kerala Olympic / Olympics Aquatics 等漏网频道）──
[[channel_pass2]]
category = "olympic_any_ch"
pattern = "(?i)olympic"

# ── 团队网球3.1 全 F 频道（n_t=0；剔除旧金标有 T 的大台/综合台）──
[[channel_pass2]]
category = "all_f_ch_tennis31_0923"
pattern = "(?i)^(Around\\ Sydney|Austin\\ Conlon|Bad\\ Pickleball|Baddie\\ Paddies|Ben\\ Morris|Chao\\ Zhu|Chatchai\\ Ratiwatana|China\\ in\\ Focus\\ \\-\\ NTD|CueballTV|Daily\\ Tennis\\ Lesson|England|FC\\ Noah|FirstRace\\ TV|HARD\\ 2\\ HANDLE\\ SPORTS|HouseDoctorZ\\ Studio's|International\\ Cheer\\ Union|Intuition\\ Hoops\\ Two|LakePoint\\ Sports|MLB|Mark\\ Alan|Memphis\\ Tigers\\ Athletics|Nepal\\ Australs\\ 2021|One\\ News\\ PH|Open\\ Court\\ \\(All\\ the\\ tennis\\ you\\ need\\)|Paralympic\\ Games|SCACsports|Snowman\\ Sports\\ Media|StokkeTennis|The\\ Cabanting\\ Squad|The\\ Emirates\\ FA\\ Cup|United\\ States\\ Tennis\\ Association\\ \\(USTA\\)|antonia412|emonwitdacamera|funchumm|janus770)\\s*$"

# ── 单打（含「Player vs Player Full Match | Round」句式，无 doubles 字样）──
[[pass2]]
category = "singles"
pattern = "(?i)(\\b(men'?s|women'?s)\\s+singles?\\b|\\bsingles?\\s+(final|sf|qf|r\\d|match|championship|highlight)|单打|.+\\s+vs\\.?\\s+.+\\s+(Full\\s*Match|Extended\\s*Highlights|Match\\s*Highlights).*\\b(Round|Final|R\\d|Open)\\b)"

# ── 舞蹈演出（团队玩法但非球类；含裸词 dance，勿匹配 Dancevic 之类姓氏）──
[[pass2]]
category = "dance_performance"
pattern = "(?i)(danc(ed|e|es|ing|in|er|ers)\\b|dancesport|dance[\\s_]*(performance|video|battle|studio|song|cover|challenge|fitness|masters|sport|nationals|competition|showcase|crew|academy|routine|kool|hall)|dancestry|bellyfolk|choreograph|ballet|ballroom|zumba|salsa|bachata|tango|hip[\\s-]*hop|k[\\s-]*pop|pole\\s*dance|cheerdance|ceroc|just\\s*dance|舞蹈|跳舞|芭蕾|街舞|拉丁舞|广场舞|舞者)"

# ── 爬取污染：篮球/橄榄球游戏等挂在网球 keyword 下（人标全 F；T_hurt=0）──
[[pass2]]
category = "nba_ball_pollution"
pattern = "(?i)(\\bnba\\b|basketball|lebron|warriors|lakers|nuggets|fib[a]|\\bpba\\b|madden|super\\s*bowl|seahawks|raptors|jokic|bronny)"

# ── 其他非团队球类串台（飞镖/桌上足球/橄榄球/MMA/小提琴/游戏网球）──
[[pass2]]
category = "other_sport_misc"
pattern = "(?i)(\\bdarts\\b|foosball|futbol[ií]n|table\\s*soccer|\\brugby\\b|\\bmma\\b|jugger|virtua\\s*tennis|twosetviolin|\\bviolin\\b)"

# ── 奥运非网球项目混入 ──
[[pass2]]
