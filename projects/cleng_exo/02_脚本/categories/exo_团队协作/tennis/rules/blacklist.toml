# Blacklist — exo_团队协作 · 网球（非团队协作闸门）
# 口径：保留双打/混双/团体及跨球类团队协作（羽球双打、匹克球、乒乓双打等）；
# 丢：单打、舞蹈、电竞、爬取污染（篮球/Madden 挂在网球 keyword 下）、全 F 串台频道。
# v0.1–v0.2: 网球独占 → 收回，团队协作都保留
# v0.3–v0.6: 舞蹈扩规则
# v0.7.0: +电竞双打串台（ProBrawlhalla / BRAWLHALLA ESPORTS）
# v0.8.0: 人标 团队网球1_daff0db4（T29/F77）→ 全 F 串台频道 + 单打句式扩 + 篮足等污染
# v0.9.0: 人标 团队网球2_7d01acf6（τ≥0.7 分层抽样 T123/F132）→ +67 全 F 频道
#         未整频道拉黑 AO/Wimbledon/United Cup/Hobart/Tennis Channel 等大台（F 多为单打）
#         验证：gold2+gold1 T_hurt=0
# v0.9.1: 拉黑 @Olympics（库内频道名 Olympic Games / Olympics；多项目污染）
# v1.0.1: +olympic_any_ch——频道名含 olympic 一律拉黑（2026-09-24 指令）
#         覆盖 9 个漏网频道（Kerala Olympic / Olympics Aquatics / olympicsingapore2010 等 22 行）；
#         ⚠ 已知代价：Kerala Olympic 14 行为真羽毛球（All Kerala Sub Junior Ranking 双打决赛）
# v1.0.0: 人标 团队网球3.1_fc6078e0（T172/F66）→ +35 全 F 频道
#         未拉黑：World Tennis / One Sports / UW Athletics / Tennis Channel 等旧金标有 T
#         全 F keyword（Davis Cup doubles 等）与排球/足球/NBA 污染混挂 → 不做 keyword 闸门

[meta]
version = "1.0.1"
category = "exo_团队协作"
sport = "tennis"
basis = "human 团队网球3.1_fc6078e0 (T172/F66); +35 all_f_ch; +olympic_any_ch; 2026-09-24"

# ── 电竞串台（Brawlhalla 双打联赛，句式像球类 doubles）──
[[channel_pass2]]
category = "esports_ch"
pattern = "(?i)^(ProBrawlhalla|BRAWLHALLA ESPORTS)$"

# ── 纯娱乐/非运动串台频道（非团队球类）──
[[channel_pass2]]
category = "cartoon_misc_ch"
pattern = "(?i)^(Being Uk comedy cartoon|The Royalty Family|Loud Speaker|Sony SAB|Jersey Shore|Saregama Dice \\(TV Shows\\) Tamil|Sri Sri)$"

# ── 纯舞蹈频道（团队玩法但非球类）──
[[channel_pass2]]
category = "dance_ch"
pattern = "(?i)^(Bitgoeul Dancers|Dance India Dance|StarDanceVideo|Random Dance Videos|Dancekool Studios|dancesctv|dancemika|Funtodancewith|LorettaBellydance3|Crossover Dance Studios|Egils Smagris|Oleg Astakhov|Dance Doctor|Mr\\. Mambo's Salsa Social|World DanceSport Federation|DANCESPORT\\.RU|REFITREV)$"

