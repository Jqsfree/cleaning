# 口径：保留双打/混双/团体合作竞争；丢网球羽球等串台 + 单打 MS/WS + 教程等。
# v0.1.x: 机采摸底串台
# v0.2.0: 人标 c90（T78/F154，pass≈33.6%）t_hurt=0 — 单打括号/教程/女团小组/全运/纯F频道
# v0.3.0: +电竞双打串台（ProBrawlhalla / BRAWLHALLA ESPORTS；doubles 句式易被误保留）
# v0.4.0: 人标 72fede47（ml_keep 上 259 条，T88/F90）→ 全 F 频道 + 舞蹈 + 串台/单打/教程扩规则
# v0.4.1: +singles_category_code（MS/WS/MT/MR 组别代码单人场，MobiSportz 299 行/146.7h）
#         验证：金标 T_hurt=0，F_caught=61/90（68%）
# v0.5.0: 并入第二批人标 853ce1b0（T78/F154）；两批合并 518 条 → 全 F 频道 66 个 + 全 F 关键词 8 个
#         验证：合并金标 T_hurt=0（166 T 全保留）
# v0.6.0: 人标 团队协作pp_6bd9a0ed（τ≥0.6 分层 T144/F110）→ +50 全 F 频道 + 串台/混团单打橡胶规则
#         未整频道拉黑 Europe TT/MALONG Fanmade/TEQ TV/Jadey PB/Shatou/Karl Uy/Ping Pong Rhapsody（旧金标有 T）
#         全 F 关键词（WTT Star Contender Men's Doubles 等）旧金标有 T → 不做 keyword 闸门
#         验证：pp+72fede47+853ce1b0 T_hurt=0
# v0.6.1: 乒乓专属硬闸——场地网球/壁球/匹克球（人标曾把网球双打标 T，MiniLM 抬进 keep）
#         频道名含 tennis/テニス 但非 tennis de table/tischtennis/table tennis；+united cup 等
#         口径：本子运动只留乒乓球，场地网球 T 视为错标不计入 T_hurt 闸门

