# Vision QC — exo 视角 · 户外探险（对齐《客户视频数据采购需求说明》五.exo）
# 入口: 02_脚本/qc/vision_thumb.py input.csv -c exo_outdoor -t 12
# 单张缩略图只能判「看起来像不像」；抖动/有效时长等需抽帧。

[meta]
category = "exo_outdoor"
category_label = "exo户外探险"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否像客户 PDF「五.exo 视角 · 户外探险」实拍封面。全满足输出 T，否则输出 F。

硬条件（缺一不可，像才过；对齐 PDF 中近景/大幅度动作/相对稳机位）：
1) 第三人称 exo：能看到探险者身体（优先全身或半身）；禁止第一人称双手/头盔/胸挂 POV、禁止录屏/游戏/动画/AI。
2) 户外探险劳作式活动：登山、徒步、攀岩、露营搭建、野外穿越、溯溪、营地搬运等；人是主体，在自然环境中。
3) 中近景：人高约占画面高度 ≥1/3；远景小人、航拍大全景只有风景无清晰人体 → F。
4) 大幅度身体动作感：像正在走、爬、搬、搭、涉水；站桩对镜口播/纯风景自拍 → F。
5) 机位相对稳定感：不像狂抖运动相机糊成一片；无假横屏（竖屏两侧模糊条）、无电影上下黑边、无赛事比分/台标铺满。

直接 F（命中任一即 F）：
- POV / GoPro 头盔视角（只见手或路面）
- 口播/访谈/固定机位说话头、旅行攻略封面
- 赛事转播远景、看台、比分条
- 成片剪辑/MV/综艺舞台/电影预告
- 室内健身房、纯风景空镜无人、静态延时无人
- 冲突格斗/竞技转播风（人过小）

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "exo户外探险中近景"
fail_label = "非目标封面"
