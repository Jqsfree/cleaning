# Vision QC — 八.通用场景 · 校园与教育
# 入口: vision_thumb.py input.csv -c general_scene -t 16
# 对齐 PDF：手持/跟拍移动为主；固定口播空镜尽量打掉

[meta]
category = "general_scene"
category_label = "通用场景校园教育"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否像客户 PDF「八.通用场景」中的校园/教育日常实拍封面。全满足输出 T，否则输出 F。

硬条件（缺一不可，像才过）：
1) 真人实拍校园/教育场景：教室、实验室、操场、食堂、宿舍、校园户外、社团活动等；学生或师生可见。
2) 第三人称或侧跟拍：能看到人的身体活动；不是纯 PPT/录屏、不是游戏/动画/AI。
3) 生活记录感：像手持走拍、跟拍活动、近景互动；不是电视台新闻包装、不是固定机位大头口播。
4) 人是主体且够清楚：不是纯建筑空镜、不是远景看不清人。
5) 画面相对干净：无假横屏（竖屏两侧模糊条）、无明显台标比分铺满、无电影上下黑边成片感。

直接 F（命中任一即 F）：
- 新闻主播/记者出镜、台标新闻条、发布会
- TEDx/讲座舞台口播、纯幻灯片录屏
- POV 头盔只见手或路面
- 游戏画面、儿歌动画、MV 舞台
- 纯风景校园空镜无人、广告商品特写无人活动

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "通用场景校园封面"
fail_label = "非目标封面"
