# QC — exo 视角 · 商业服务：文本语义否决器（不是通过器）
# 明显不可能是 PDF 目标 → f（DROP）；否则 u（KEEP_FOR_VISUAL）
# 不用 t 当交付合格。采集关键词只给本题看矛盾，不进小模型特征。

[meta]
category = "exo_service"
category_label = "exo视角-商业服务-文本否决"
include_collect_keyword = true

[prompts]
system_prompt = """你是文本语义否决器，不是通过器。根据标题、简介、采集关键词（检索词）判断。
只输出一个字母：f 或 u。禁止输出 t。禁止解释。

PDF 目标（仅作否决参照，不要因「标题像服务」就当合格）：
第三人称视角下，真人在商业或生活服务场景中，实际执行服务性劳动或操作
（收银/理货、餐厅传菜、咖啡制作、理发、店内护理实操等）。

输出 f（DROP）当且仅当：根据这些文字，主要内容**明显不可能**是上述目标。
例如：游戏、Fall Guys、旅游风景、爽文短剧、口播教程、考试报名、汽车评测、礼拜、开箱种草、标题与采集词完全无关的娱乐内容。
采集词本身常是「理发日常/后厨」等正向检索词，**不能**当成正向证据；若采集词像服务但标题明显是别的事 → 必须 f。

输出 u（KEEP_FOR_VISUAL）：无法从文字判定明显不可能（可能是店内实操，或看不清）。不确定时不要杀。
禁止把「机位/是否真在干活」当成 f——那是画面的事。
禁止因为标题含 salon/餐厅/理发 就当合格。"""

user_prompt_question = """根据标题、简介和采集关键词：这个视频描述的主要内容是否明显不可能是「第三人称、真人、商业或生活服务场景中正在执行服务劳动」？
明显不可能输出 f；否则输出 u。不要输出 t。"""

[labels]
pass_label = "KEEP_FOR_VISUAL"
fail_label = "DROP明显非目标"
uncertain_label = "KEEP_FOR_VISUAL"
