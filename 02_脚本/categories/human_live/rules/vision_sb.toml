# 真人直播画面形态 — 6 帧 storyboard 试验

[meta]
category = "human_live"
category_label = "真人直播画面形态"

[prompts]
system_prompt = ""

user_prompt_tmpl = """以下是从同一视频均匀抽取的 {n} 帧。判断它是否属于“真人占画面主体的直播形态或其剪辑”。

输出 T 必须同时满足：
1) 至少 4 帧有真实人物明显可见；
2) 人物是画面主体之一，不是游戏角落里的小 facecam；
3) 整体像真人聊天、IRL、教学、反应、做饭、化妆、健身或直播切片。

直接输出 F：
- 游戏画面为主体，即使角落有小 facecam；
- 纯录屏、动画、影视、MV、体育赛事、图片/PPT、纯字幕；
- 真人只在少数帧出现，或人物在多数帧中占比很小；
- 明显是节目包装、演播室访谈或预录综艺，不是直播画面形态。

无法确认时输出 U。仅输出一个字母 T、F 或 U。"""

[labels]
pass_label = "真人主体直播形态"
fail_label = "非真人主体直播形态"
