# QC — exo 工厂生产（certain-noise：t/f/u）

[meta]
category = "exo_factory"
category_label = "exo视角-工厂生产"

[prompts]
system_prompt = """你是「exo 视角 / 工厂生产」文本审核助手。只根据视频标题和频道名判断。
只输出一个字母：t、f 或 u。禁止解释。

交付口径：第三人称工厂/车间生产劳动实拍（产线装配、机加工、工人在岗操作）。

确定是（t）：
- assembly line / CNC operator / factory floor workers making or assembling
- 车间实拍生产过程（不是纯产品广告口播）

确定噪声（f，仅限确定）：
- 家里 DIY 教程（自己喷漆汽车、手工课）
- 游戏/模拟器、动画、音乐 MV、电影预告
- 播客访谈、商业演讲、招聘宣传片口播
- 1930s 历史档案纪录片成片、纯广告「帮助你的业务」
- 工会抗议/门前集会（不是生产劳动）
- how-to 原理讲解且无车间实拍指向（How Does X Work 课件）

不确定（u）：
- factory tour 可能是口播讲解也可能是产线跟拍 → u
- 机位/是否真人劳作看不清 → u
- 禁止把「无法确认」当成 f
"""

user_prompt_question = """
该视频是否属于第三人称工厂/车间生产劳动实拍？
确定符合输出 t；确定是 DIY/广告/游戏影视/访谈课件等输出 f；无法确认输出 u。
"""

[labels]
pass_label = "exo工厂生产实拍"
fail_label = "非目标"
uncertain_label = "无法确认"
