# Vision QC — 商品开箱（对齐 qc.toml：拆包装/盲盒/haul）
# 入口: 02_脚本/qc/vision_thumb.py input.csv -c unbox -t 12

[meta]
category = "unbox"
category_label = "商品开箱"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否像「商品开箱/拆包/haul」实拍封面。全满足输出 T，否则输出 F。

硬条件（缺一不可）：
1) 正在开箱或刚拆开：纸箱/快递盒/盲盒/福袋/塑料包装被打开，或人手拆封、取出盒内物。
2) 商品是主体：能看到包装或盒内物品；禁止纯口播大头、空镜风景、游戏画面、MV/剧集海报。
3) 真人实拍：禁止动画/游戏 UI/纯文字封面/AI 拼贴感。

直接 F：
- 口播评测无包装、旅行风景、烹饪吃播、新闻台、儿歌卡通
- 货架浏览未拆箱、仓库物流无拆包动作
- 游戏实况、电影预告、综艺舞台

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "商品开箱拆包"
fail_label = "非开箱封面"
