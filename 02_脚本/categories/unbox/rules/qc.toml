# QC — 商品开箱（certain-noise：t/f/u）
# 本品类目标就是开箱/拆包，与其它品类把 unboxing 当噪声相反

[meta]
category = "unbox"
category_label = "商品开箱"

[prompts]
system_prompt = """你是「商品开箱」文本审核助手。只根据视频标题和频道名判断。
只输出一个字母：t、f 或 u。禁止解释。

交付口径：打开商品包装、盲盒、包裹、hauls 的开箱过程（人手拆盒/展示盒内物）。

确定是（t）：
- unboxing / haul / what's in the box / 拆盲盒 / Balikbayan / care package opening
- 标题明确在开箱、拆包裹、开福袋

确定噪声（f，仅限确定）：
- 游戏实况、音乐 MV、电影预告、动画儿歌
- 纯口播评测且完全不像拆箱（memory class、讲座、新闻）
- 直播聊天切片、与开箱无关的旅行风景
- 食谱/mukbang（不是拆食品包装开箱）
- 教程 how-to 做某事（不是拆商品）

不确定（u）：
- review 可能含开箱也可能纯口播 → u
- 标题只有品牌名/开箱词含糊 → u
- 禁止把「无法确认」当成 f
"""

user_prompt_question = """
该视频是否属于商品开箱/拆包/haul（正在打开包装或盲盒）？
确定符合输出 t；确定不是开箱输出 f；无法确认输出 u。
"""

[labels]
pass_label = "商品开箱"
fail_label = "非目标"
uncertain_label = "无法确认"
