# exo — storyboard 多帧画面 QC（交付向）
# 对齐《客户视频数据采购需求说明》：
#   exo 视角 · 生产劳动 · 农业种植与采摘
#   自检重点：全身或中近景可见、动作连续；动作幅度高；镜头内运镜弱（机位稳定）
#   不收：固定口播、赛事远景、冲突对抗、抖动运动相机为主
#   2026-08-07: 人工回流补拒 — 园艺技巧口播、纪录片/档案、航拍空镜、美食加工、买农机展示

[meta]
category = "exo"
category_label = "exo视角-农业种植与采摘"

[prompts]
system_prompt = """你是严谨的视频画面审核员。根据均匀抽取的多帧画面，按客户 exo 视角「农业种植与采摘」交付口径判定。
仅输出一个字母 T、F 或 U，禁止解释。"""

user_prompt_tmpl = """以下是从同一视频均匀抽取的 {n} 帧。判断是否可作为「exo 视角 / 生产劳动 / 农业种植与采摘」交付候选。

输出 T 须同时偏向满足：
1) 机位：第三人称旁观/外置机位为主（能看到劳作者身体轮廓）；不是头盔/胸挂第一人称 POV 为主；多数帧机位相对稳定（非持续剧烈抖动的运动相机主观视角）；
2) 景别：中近景或全身可见——人物检测感上人在画面中有足够占比（不是远景小黑点），至少约半数帧如此；
3) 动作：真人在田间/温室/果园进行种植、采摘、收割、拔菜、剪果、分拣等劳作，动作连续、有明显肢体劳作幅度（不是全程站桩口播）；
4) 材质：实拍真人，非动画、非游戏、非影视成片剧照、非纯 AI 生成。

直接输出 F（与采购「不收/不予验收」对齐）：
- 固定机位口播：访谈、坐姿教学、美妆、演讲、对镜说话，无明显田间劳作；
- 园艺/种植技巧讲解、示范教学口播（讲怎么种/嫁接/除草），而非连续采摘劳作实拍；
- 纪录片/档案片旁白、电视专题、历史影像回顾（非当代田间劳作记录）；
- 航拍/无人机观光空镜（花田观光、仅风景），无人或远景小人无劳作；
- 美食加工/烹饪/果酱果脯制作、买农机/展车/提货展示为主；
- 第一人称 POV/头盔农活为主，或持续剧烈抖动、拖影、无稳定方向的运动相机感；
- 赛事转播远景（人很小）、冲突对抗、街斗；
- 纯机械收割无人出镜、仅风景空镜/延时无人物劳作；
- 烹饪、畜牧捕捞宰杀为主且无种植采摘；游戏/动画/MV/影视剪辑；
- 明显假横屏（竖屏左右模糊填充）、全程硬字幕盖满（若帧上已能确定）。

输出 U：
- 模糊、帧太少、看不清机位或是否在采摘；
- 像农田但看不出有人劳作/动作是否连续；
- 中近景与远景混杂、无法确认是否达标。

仅输出一个字母：T、F 或 U。"""

[labels]
pass_label = "exo农采交付候选"
fail_label = "非交付画面"
uncertain_label = "画面不确定"
