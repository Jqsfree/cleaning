# 画面 QC — exo 缩略图场景闸（仅封面）
# 作用：确定「是不是农业种植/采摘相关实拍场景」；排除确定不是的场景。
# 不做：第三人称机位、中近景占比、动作连续、抖动、有效时长 → vision_sb.toml。

[meta]
category = "exo"
category_label = "exo视角-农业场景确定"

[prompts]
system_prompt = """你是视频缩略图场景审核员。只根据单张 YouTube 封面判断：是否为「农业种植/采摘相关实拍场景」。
目标：确定是场景 → T；确定不是 → F；看不清 → U。
仅输出一个字母 T、F 或 U，禁止解释。
封面验不了机位/动作连续/抖动/时长——这些不要用来判 F 或硬卡 T。"""

user_prompt_tmpl = """以下是该视频的缩略图（共 {n} 张，通常仅 1 张封面）。

任务：确定场景是否属于「农业种植与采摘相关实拍」。排除确定不是的场景。

输出 T（确定是农业种植/采摘相关实拍场景）——封面已能确认至少一项：
- 农田、菜地、果园、茶园、田间垄沟、温室大棚等种植环境，且偏向劳作/作物实拍（非纯观光明信片）；或
- 真人正在种植、移栽、采摘、收割、拔菜、剪果、疏果、田间分拣蔬果/作物；或
- 作物与劳作工具/筐篓同框，明显是田间/棚内生产劳动气氛。

直接输出 F（确定不是目标场景 / 采购不收的封面）：
- 口播访谈、坐姿/对镜教学、美妆、演讲、演播室、舞台综艺、新闻播报
- 园艺/种植技巧讲解板、示范口播封面（讲怎么种/嫁接/修剪），而非田间劳作实拍
- 赛事转播远景、影视海报/剧照、游戏/动画/CG
- 纯厨房屋内做菜、果酱果脯加工台、街边小吃摊、超市开箱试吃
- 买农机/展车/提货/农机展览秀，无明显田间采摘劳作
- 明显航拍/无人机花田观光空镜（无人或仅远景小人、纯风景宣传）
- 纪录片/电视档案海报风、历史专题片封面（年代条、台标专题感为主）
- 畜牧养殖棚/捕捞宰杀为主且无种植采摘
- 冲突对抗、街斗、纯室内生活/装修/露营求生等非农场景

输出 U：
- 模糊、过暗、裁切严重，无法确认是否农田/作物/采摘
- 只有人或模糊风景，不能确定农业题材
- 可能是农业，但更像广告海报/空镜，没有把握判 T 或 F

不要因为「看不清是否第三人称/全身/动作连续」就给 F——那是 storyboard 的任务；场景不定才给 U。
仅输出一个字母：T、F 或 U。"""

[labels]
pass_label = "农业种植采摘场景（封面确定）"
fail_label = "非目标场景（封面排除）"
uncertain_label = "封面场景不确定"
