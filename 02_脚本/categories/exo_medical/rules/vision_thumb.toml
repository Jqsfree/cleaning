# Vision QC — exo_medical：医疗实操 + 完整出镜（R1 强度）
# 封面花字由 L2b score_thumb_text_heavy 前置处理；VL 不判文字密度。
# 入口: 02_脚本/qc/vision_thumb.py input.csv -c exo_medical -t 12

[meta]
category = "exo_medical"
category_label = "医疗实操-完整出镜"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否属于「医疗/护理实操 + 完整的人出镜」候选。只输出 T 或 F。

硬要求（缺一不可，否则 F）：
1) 完整的人出镜：至少一个真人的头和躯干（半身或全身），人物在画面中足够大、可辨认（约占画面高度约 1/4 及以上）。人很小、远景蚂蚁人、主体几乎看不清 → F。
2) 医疗实操场景：诊室/手术台/模拟病房/技能实验室里，人正在做操作（缝合、换药、插管、注射、CPR、体位、仪器、无菌准备等），不是坐着对镜头讲课。

**非真人一律 F**：游戏、动画/卡通、AI 生成、CGI/虚拟人、VTuber、纯绘面。看不清是不是真人实拍 → F。

**下列一律 F**：
- 对镜头口播/访谈/新闻主播/播客、患者证言大头
- 考证刷题/PPT/录屏、网课讲师大头
- 商品静物/设备广告图、开箱带货、美妆口播、短剧/MV/娱乐
- 只有病灶特写、只有双手特写、俯拍只有器械没有完整的人
- 明显第一人称/POV/头盔（镜头=操作者眼睛，手从画面下方伸入）
- 行政流程/产品兼容说明/影像扫查演示等非 bedside 实操

**输出 T**：外拍能看到足够大的完整的人（头+躯干）在医疗场景里动手。封面略糊或少量角落水印可接受。

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "完整出镜医疗实操"
fail_label = "非实操/人过小/非真人"
