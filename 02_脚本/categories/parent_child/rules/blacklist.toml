# Blacklist — 亲子互动（certain-noise only）
# v0.1.0: round1 QC 累计 534（T117/F267/U137）；只写入 ≥3F 且 0 T/U 的确定噪声
# 不加「우리 아이」（亲子口径词）、不加短词「아이스」

# v0.2.0: round1 QC；v0.3.0: lt50 run02 新鲜样本 — asmr_eat_drink、1million_dance
# v0.4.0: 0818 ge50(263)+lt50 hardkeep(271) text QC；韩文故事/电台剧/睡眠童话（15 项，均 ≥3F 0 T/U）
# 不加 lion_dance（命中 1MILLION Dance 子串）、不加 dance_studio（儿童舞蹈易误杀）、不加 podcast_interview（累计有 U）

[meta]
version = "0.4.0"
category = "parent_child"
basis = "machine_0818 ge50+lt50 hardkeep text QC 2026-08-20; qc.toml v0.2 prompts"

