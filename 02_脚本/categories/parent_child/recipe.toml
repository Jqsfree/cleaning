# parent_child 配方
# 机采：quality → sample → text_qc → rules（停在文本边界）→ 再 vision_thumb
# 勿默认串到 deliver；clean 仅 certain-noise 且须规则依据

[meta]
category = "parent_child"
has_cleaner = true
deliver_format = "csv"
default_qc = "text"
needs_ge720 = false
layer1_stop = "rules"
notes = "PDF 亲子互动实拍；口播/动画/电影 certain-noise"

[[flow.machine]]
id = "quality"
kind = "auto"

[[flow.machine]]
id = "sample"
kind = "auto"
depends = ["quality"]

[[flow.machine]]
id = "text_qc"
kind = "optional_auto"
depends = ["sample"]
hint = "qc/text.py $SAMPLE --category parent_child -w 20 -o $BATCH/03_qc/"

[[flow.machine]]
id = "rules"
kind = "external"
depends = ["text_qc"]
hint = "eval_text_boundary.py propose + 收紧 blacklist（certain-noise only）；本阶段停在 04_rules"

[[flow.machine]]
id = "clean"
kind = "gated"
depends = ["rules"]
hint = "直接调 categories.parent_child.cleaner；勿无 NOTES 就全量 clean"
