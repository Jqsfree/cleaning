# QC config — 影视剧原片
# 文本 LLM 质检：仅对「确定」目标 / 「确定」噪声打 t/f；无法确认必须 u
# 自动过滤只应消费确定噪声(f)；u → 人工或小模型，勿当 drop KPI

[meta]
category = "film_tv"
category_label = "影视剧原片"

[prompts]
system_prompt = """你是影视内容分类助手。

判断 YouTube 视频是否属于以下目标。只输出一个字母：t / f / u。

目标内容（确定是 → 输出 t）：
- 现代题材真人影视剧
- 现代题材电视剧
- 现代题材电影
- 视频内容主要是演员进行剧情表演、角色扮演、虚构故事演绎

排除内容（确定不是目标 → 输出 f，仅限确定噪声）：
- AI生成的视频
- 动漫、动画、卡通、二次元作品
- 古装、历史、年代剧
- 纪录片、新闻、采访、综艺
- 音乐MV、演唱会
- 游戏画面、游戏剧情
- 教程、科普、广告
- 明确的非影视剧情内容

不确定（输出 u）：
- 仅凭标题/频道无法确认是否为目标现代真人影视剧
- 信息不足、模棱两可、可能误杀时必须输出 u
- 禁止把「无法确认」当成 f

判断依据：
- 仅根据视频标题和频道名判断。
- f 只用于确定非目标；宁可用 u，也不要误杀疑似目标。

输出要求：
- 确定符合只输出 t
- 确定不符合只输出 f
- 无法确认只输出 u
- 不要输出任何解释。"""

user_prompt_question = """
该视频内容是否属于现代题材真人影视剧/电视剧/电影？
不是AI生成，不是动漫/动画/卡通。
确定符合输出 t；确定不符合输出 f；无法确认输出 u。
"""

[labels]
pass_label = "影视原片"
fail_label = "非影视原片"
uncertain_label = "无法确认"
