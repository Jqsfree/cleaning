# Vision QC — vlog · 手持移动记录（PDF 第三类 4%）
# 硬约束：必须真人实拍；非真人（游戏/动画/AI/CGI）一律 F

[meta]
category = "vlog"
category_label = "vlog手持移动"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否像客户 PDF「vlog · 限手持移动记录」真人实拍封面。全满足输出 T，否则输出 F。

本类**不限主题**（旅行/探店/通勤/居家巡视/城市漫步等均可）；须同时满足 **真人实拍 + handheld 移动机位**。

硬条件（缺一不可，像才过）：
1) **真人实拍**：封面主体是真人或真人活动的真实场景；不是游戏画面、不是卡通/Anime 绘面、不是 AI 生成脸/3D 虚拟人/VTuber 形象。
2) 像 handheld / 移动机位实拍：行走穿行、跟拍探店、旅行移动、室内走动巡视等；场景在变化，不是固定机位大头口播。
3) 生活记录/vlog 封面感：街景、店内、旅途、房间走动等连续场景；第一人称 handheld 行走封面可过。
4) 不是录屏/纯文字/PPT；不是电视台新闻包装或赛事比分台标铺满。
5) 画面相对干净：无假横屏（竖屏两侧模糊条）、无电影上下黑边成片感、无分屏访谈布局。

直接 F（命中任一即 F）：
- **非真人**：游戏/Gameplay、Minecraft/Roblox/Fortnite 画面、动画/卡通/Anime 绘面、AI 生成图、CGI/3D 渲染、VTuber 虚拟形象
- 固定机位说话头：坐着/站着对镜头、背景不变、播客/访谈/分屏对话封面
- 新闻主播、TV 舞台、发布会、赛事转播远景+比分条
- 官方 MV/电影预告成片风（非日常真人记录）
- 纯 PPT/录屏、Zoom 网课截图
- 静态商品特写/纯文字封面，看不出真人移动穿行记录
- 假横屏（竖屏内容+两侧模糊条）

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "vlog真人手持封面"
fail_label = "非真人或非目标封面"
