# Vision QC — vlog storyboard 多帧（PDF 第三类 4%）
# 输入：YouTube 全片均匀 storyboard 低清格（默认 4–8 张），不是片头、不是单张封面
# 硬约束：真人实拍 + 边走边拍/移动机位；固定机位口播一律 F
# 本批不卡平均镜头时长

[meta]
category = "vlog"
category_label = "vlog手持移动"

[prompts]
system_prompt = ""

user_prompt_tmpl = """以下是同一 YouTube 视频按时间均匀抽取的 {n} 张 storyboard 低清格（覆盖全片，不是片头、不是封面）。判断是否属于客户 PDF「vlog · 限手持移动记录」：真人实拍 + 边走边拍。

本类**不限主题**（旅行/探店/通勤/居家巡视/城市漫步/车载移动等均可）。必须同时满足真人实拍 + 机位随人在空间中位移。综合多帧判断，不要只看一张。

输出 T 必须同时像：
1) **真人实拍**：真人或真人活动的真实场景，不是游戏/动画/AI/CGI/VTuber。
2) **边走边拍 / 移动机位**：机位随拍摄者或被跟拍的人在空间里前进或跟随。算过：步行穿行、探店走动、旅行移动、居家巡视、通勤路上、坐车/骑车窗外、第三人称跟拍走路。第一人称 handheld 行走可过。
3) 生活记录/vlog 感，不是成片电影预告、MV、新闻包装。

不要因为「多格场景不同」就打 T：硬切换景、B-roll 拼贴不等于边走边拍。要看出机位在走路/跟拍/车载位移，而不是固定机位换镜头。

直接 F（命中任一即 F）：
- 非真人：游戏/Gameplay、动画/卡通/Anime、AI 生成、CGI/3D、VTuber
- **固定机位**：坐着/站着对镜头口播、说话头、背景几乎不变、播客/访谈/分屏；手持微晃但人没在走也算固定
- 脚架只 pan/zoom、多格都是同一说话头背景
- 新闻主播、TV 舞台、赛事转播+比分条
- 官方 MV/电影预告成片风
- 纯 PPT/录屏、Zoom 网课
- 假横屏（竖屏+两侧模糊条）

输出 U：
- 过暗过糊、格太少，看不清机位是否在走
- 口播与走路混在一起，无法确认主体是边走边拍还是固定口播

只输出一个字母 T、F 或 U，不要解释。"""

[labels]
pass_label = "vlog真人手持移动"
fail_label = "非真人或固定机位"
uncertain_label = "无法确认"
