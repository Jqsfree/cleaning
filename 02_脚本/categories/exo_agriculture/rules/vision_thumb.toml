# Vision QC — exo 视角 · 农业种植与采摘
# 策略：只 F「确定噪声」；像田间/园地劳作或看不清 → T（少误杀）
# 入口: 02_脚本/qc/vision_thumb.py input.csv -c exo_agriculture -t 12
# 单张封面验不了机位/动作连续；不要用第三人称/中近景硬卡 F。

[meta]
category = "exo_agriculture"
category_label = "exo农业种植采摘"

[prompts]
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否允许进入「农业种植/采摘」候选。只输出 T 或 F。

**非真人一律 F**（命中任一即 F）：
游戏/Gameplay、动画/卡通/Anime、儿童 DVD 卡通农场、AI 生成脸或场景、CGI/3D、VTuber、纯绘面。看不清是不是真人实拍时，为防非真人进入，输出 F。

确定噪声也 F（封面已能看清）：
- 对镜头口播/访谈/新闻主播/播客分屏/坐着讲课 PPT
- 纯风景/旅游明信片：山谷村庄、花田空镜、无人或远景小人观光，没有田间劳作
- 成片纪录片海报、BBC/电视台包装、电影上下黑边、标题卡铺满
- 室内厨房烹饪、试吃、做醋/果酱、纯餐桌
- 盖房/木工/装修/DIY 家具，画面里没有作物或田间劳作
- 纯商品静物广告、农机展厅/新车特写无人下地
- 假横屏（竖屏两侧模糊条）

输出 T（其余都过，包括拿不准）：
- 真人在田间、菜地、果园、温室种植、采摘、装筐、搬运作物
- 能看到人或手在作物旁劳作；不要只因「可能是 POV / 远一点 / 有农机」就 F
- 封面略糊、角度一般、园艺小园地 → T

不要用「不够中近景 / 不像第三人称全身」打 F。只对非真人和上面那些确定噪声打 F。

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "农业种植采摘候选"
fail_label = "非真人或确定噪声封面"
