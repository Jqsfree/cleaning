# Vision QC — exo 视角 · 农业种植与采摘（对齐《客户视频数据采购需求说明》五.exo / 生产劳动）
# 入口: 02_脚本/qc/vision_thumb.py input.csv -c exo_agriculture -t 12
# 单张 YouTube 缩略图只能判「看起来像不像」；动作连续/抖动比等时序指标需后续抽帧。

[meta]
category = "exo_agriculture"
category_label = "exo农业种植采摘"

[prompts]
# 空 system：调用端省略 system，规则全在 user（Qwen-VL 推荐）
system_prompt = ""

user_prompt_tmpl = """看这张 YouTube 缩略图（共 {n} 张），判断是否像「第三人称 exo 视角的农业种植/采摘/田间劳作」实拍封面。全满足输出 T，否则输出 F。

硬条件（缺一不可，像才过）：
1) 第三人称实拍：能看到劳动者身体（优先全身或半身），不是第一人称双手特写/头盔 POV，不是录屏/游戏/动画/AI 拼贴。
2) 农业劳作场景：田间、果园、菜地、温室里正在种植、采摘、采收、分拣装筐、田间搬运作物等；人是主体。
3) 中近景：人在画面中够大（人高大约占画面高度 ≥1/3）；远景小人、航拍大全景只有地没有清晰劳动者 → F。
4) 动作感：封面应像正在弯腰、伸手采摘、切割、装筐、搬运等劳作，而不是站着对镜头讲话。
5) 画面相对干净：没有明显平台水印/台标铺满、没有假横屏（竖屏两侧模糊条）、没有电影上下黑边成片感。

直接 F（命中任一即 F）：
- 口播/访谈/新闻评论、固定机位说话头、分屏访谈
- 园艺技巧讲解封面、秘方/挑战/实验/DIY 教程风（无明显田间劳作身体动作）
- 室内阳台盆栽特写、仅蔬菜特写无人、纯风景空镜
- 大型农机主导（拖拉机/联合收割机驾驶室特写盖过人）、纯机械设备广告
- 烹饪成品、开箱、直播带货口播、赛事转播、成片剪辑宣传图
- 养蜂/堆肥讲座/选址讲解等非「种植采摘劳作」主体（即便标题含 farm）

只输出一个字母 T 或 F，不要解释。"""

[labels]
pass_label = "exo农业劳作中近景"
fail_label = "非目标封面"
