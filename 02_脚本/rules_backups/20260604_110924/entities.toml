[[channel_whitelist]]
# 命中黑名单但确认为真实体育的频道/赛事名，黑名单豁免
# 来源：run02 FN 分析，step1_blacklist 误杀样本
terms = [
  "FEI",
  "HITS Ocala",
  "FIE Fencing",
  "Northern Ireland Open",
  "Dressage",
]
action = "skip_blacklist"
category = "verified_sport"

[channel_whitelist_regex]
pattern = "(?i)\\b(FEI|HITS\\s*Ocala|FIE\\s*Fencing|Northern\\s*Ireland\\s*Open|Dressage)\\b"

