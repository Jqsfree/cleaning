# Whitelist / scoring rules

strong_sport_title_pattern = "\\b(match|final|semi[\\s-]?final|quarter[\\s-]?final|highlights|full\\s*(match|game|race|replay|coverage)|vs\\.?|\\svs\\s|versus|championship|tournament|olympic|world\\s*cup|grand\\s*prix|diamond\\s*league|commentary|play[\\s-]?by[\\s-]?play|broadcast|live\\s*stream|round\\s*\\d|bout|regatta|grand\\s*final|shootout|overtime|national\\s*games|varsity|campeonato|@\\s*\\w+|flames|canadiens|lakers|celtics)\\b"

[meta]
version = "2.0"
keep_score = 35
gray_score_low = 15
medium_min_score = 15
playlist_min_samples = 5
playlist_min_hit_rate = 0.10

[[positive]]
category = "match_event"
pattern = "\\b(full\\s*)?(match|game|race|replay|coverage)\\b"
score = 25

[[positive]]
category = "highlight"
pattern = "\\b(highlights?|extended\\s*highlights)\\b"
score = 20

[[positive]]
category = "other"
pattern = "\\b(live\\s*stream|live\\s*broadcast|\\blive\\b)\\b"
score = 18

[[positive]]
category = "broadcast_type"
pattern = "\\b(commentary|play[\\s-]?by[\\s-]?play|broadcast)\\b"
