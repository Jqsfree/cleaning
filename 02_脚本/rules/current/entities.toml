french = ["francais", "français", "francese"]
german = ["deutsch", "tedesco", "alemán", "alemao"]
italian = ["italiano"]
portuguese = ["portugues", "português", "portoghese"]
russian = ["russkiy", "русский"]
arabic = ["arabiya", "عربية", "العربية"]
hindi = ["हिन्दी", "हिंदी"]
dutch = ["nederlands", "holandes"]
turkish = ["turkce", "türkçe", "турецкий"]
vietnamese = ["tieng viet", "tiếng việt"]
indonesian = ["bahasa indonesia", "bahasa"]
swahili = ["kiswahili"]
farsi = ["persian"]
tagalog = ["filipino"]

# ═══════════════════ 知名语言教学频道白名单 ═══════════════════
[channel_whitelist_regex]
pattern = "(?i)(learn\\s*(english|french|spanish|german|japanese|chinese|korean|italian|arabic|russian|portuguese|hindi|dutch|polish|turkish|greek|swedish|norwegian|danish|finnish|czech|thai|vietnamese|indonesian|hebrew|persian|urdu|tamil|tagalog|swahili|afrikaans|icelandic|croatian|serbian|bulgarian|romanian|hungarian|ukrainian)|\\w+\\s*(class|lesson|course|school|academy|institute|tutor|coach|teacher)\\b|polyglot|linguist|multilingual|bilingual|\\b(BBC\\s*Learning\\s*English|VOA\\s*Learning\\s*English|English\\s*with\\s*\\w+|Learn\\s*\\w+\\s*with\\s*\\w+|\\w+Pod101|\\w+Class101|Easy\\s*(Languages|German|French|Spanish|Italian|English|Russian|Japanese|Chinese|Korean))|Talk\\s*To\\s*Me\\s*In\\s*Korean|Comprehensible\\s*Input|RealLife\\s*English|Speak\\s*English\\s*With)"
