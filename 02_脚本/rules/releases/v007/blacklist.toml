pattern = "\\b(VGBootCamp)\\b"


# ===== B类实验第二步: 通用游戏/电竞词 → 共享 r2 =====
# 来源: promote_generic_rules.py 全量扫描 + classify_promote.py B类分析
# 原则: 仅游戏内容类型词 (排除频道名), 避开已有共享规则
# 生成: 2026-06-08

# ── 核心电竞游戏 (net new, 不重叠已有 minecraft/smash/starcraft 等) ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(dota\\s*2|league\\s*of\\s*legends|valorant|overwatch|brawlhalla)\\b"

# ── GTA 系列 + Cyberpunk ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(gta\\s*[45v]|grand\\s*theft\\s*auto|cyberpunk)\\b"

# ── Warcraft / CS / 竞技射击 ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(wc3\\b|warcraft\\s*iii|cs\\s*1\\.6|cs2\\s*highlights)\\b"

# ── 其他跨运动游戏 (≥6 运动稳定命中) ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(genshin\\s*impact|danganronpa|tekken\\s*8|hades\\s*ii|roguelike|boss\\s*fight)\\b"

# ── SSBM/SSBB (Smash 系列补全, ssbu/ssb4 已在共享) ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(ssbm|ssbb|noob\\s*vs\\s*pro|ravenfield|rivals\\s*2|lucky\\s*blocks)\\b"

# ── FIFA/EA 游戏模式通用词 ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(squad\\s*battles|pack\\s*openings|obby|retro\\s*bowl|stream\\s*highlights|uninstalling)\\b"

# ── 电竞联赛/赛事 ──
[[r2]]
category = "gaming_esports"
pattern = "\\b(\\bLCK\\b|LCK\\s*CUP|LCK\\s*Spring|LCK\\s*Summer)\\b"

[[r2]]
category = "gaming_esports"
pattern = "\\b(ESL\\s*Archives|ESEA|IEM\\s*Dallas|VCT\\s*\\d{4}|DreamLeague|StarLadder|joinDOTA)\\b"

[[r2]]
category = "gaming_esports"
pattern = "\\b(Rocket\\s*League\\s*Tournament|Esports\\s*World\\s*Cup|StarCraft\\s*Esports|eSportCOD)\\b"


