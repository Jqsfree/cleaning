[project]
name = "sport-live"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "requests>=2.28",
    "openai>=1.0",
    "httpx>=0.25",
    "streamlit>=1.28",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
vision = [
    "opencv-python-headless>=4.0",
    "pillow>=10.0",
]

